<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14211b" />
  <meta name="description" content="The best growing conditions for wild mushrooms in Cyprus forests today. Conditions only." />
  <title>Cyprus Mushroom Finder (simple)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15c0-6 5-11 12-11s12 5 12 11z' fill='%23e0b040'/%3E%3Crect x='12' y='15' width='8' height='12' rx='3' fill='%23e9efe6'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="s-app">
    <header class="s-top" role="note">
      <svg class="s-warn" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm0 6c.6 0 1 .4 1 1v5a1 1 0 1 1-2 0V9c0-.6.4-1 1-1Zm0 11.2a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
      <p class="s-safety"><b>Conditions only.</b> Never eat a wild mushroom based on this map, an app or an AI.</p>
      <button class="s-sos" type="button" data-emergency aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1z"/></svg>
        <span>Emergency</span>
      </button>
    </header>

    <main class="s-stage">
      <section id="answer" class="s-card s-answer" aria-label="Best growing conditions"></section>
      <div class="s-mapwrap">
        <div id="map" role="region" aria-label="Map of growing conditions in Cyprus"></div>
        <section id="zone" class="s-card s-zone" aria-live="polite" hidden></section>
        <div id="loading" class="s-loading" role="status">Loading the forest map…</div>
      </div>
    </main>

    <footer class="s-foot">
      <p class="s-rakes"><b>No rakes.</b> Pick by hand or knife. Put the leaf litter back.</p>
      <button id="more-btn" class="s-more-btn" type="button" aria-haspopup="dialog">More</button>
    </footer>
  </div>
  <script type="module" src="/src/simple/main.ts"></script>
</body>
</html>
