<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14211b" />
  <meta name="description" content="Today's growing conditions for wild mushrooms in Cyprus forests. Conditions only. Never eat a wild mushroom based on this map, an app or an AI." />
  <meta property="og:title" content="ShroomyMap" />
  <meta property="og:site_name" content="ShroomyMap" />
  <meta property="og:description" content="Today's growing conditions for wild mushrooms in Cyprus forests. Conditions only." />
  <title>ShroomyMap · mushroom growing conditions in Cyprus</title>
  <link rel="icon" href="brand/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="brand/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="ShroomyMap, home" data-tip="Reload the map.">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-text"></span>
      </a>
      <a class="about-link" href="about.html" data-tip="What this map shows, where the data comes from, and its limits.">About</a>
      <button class="sos" type="button" data-emergency aria-haspopup="dialog" aria-label="Poisoning emergency: 112 and 1401"
        data-tip="Mushroom poisoning help: call 112 (ambulance) or the Cyprus Poison Centre 1401. Do not wait for symptoms.">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1z"/></svg>
        <span>112 · 1401</span>
      </button>
    </header>

    <div class="safety" role="note">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm0 6c.6 0 1 .4 1 1v5a1 1 0 1 1-2 0V9c0-.6.4-1 1-1Zm0 11.2a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
      <span>Conditions only. Never eat a wild mushroom based on this map, an app or an AI.</span>
    </div>

    <main class="stage">
      <div id="map" role="region" aria-label="Map of today's growing conditions in Cyprus"></div>
      <div id="loading" class="loading" role="status"><span class="spinner" aria-hidden="true"></span>
        <span id="loading-text">Loading the forest map…</span></div>
      <div id="delayed" class="delayed" role="status" hidden></div>
      <div id="map-legend" class="map-legend" role="img" tabindex="0"></div>
      <section id="sheet" class="sheet" aria-label="Today and the tapped square"></section>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
